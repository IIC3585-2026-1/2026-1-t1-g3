<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Juego de Memoria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-info">
  <p>Moves: <span id="moves">0</span></p>
  <p>Matches: <span id="matches">0</span></p>
  <button type="button" class="game-button">Restart</button>
</div>
<div class="game">
  <h1>Juego de Memoria de Lenguajes de Programación</h1>

  <div class="board"></div>
</div>
<div class="toast" id="toast"></div>
<div class="win-notification" id="win-notification">
  <div class="win-card">
    <h2>¡Ganaste!</h2>
    <p>¡Encontraste todos los pares!</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
